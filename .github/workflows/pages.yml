# Publishes the site to GitHub Pages on every push to main.
# Before publishing it stamps the commit id into the ?v= of every script and stylesheet in index.html,
# so browsers always load the new files together after a release (no manual version bumps).
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Stamp version into asset links
        run: |
          V="${GITHUB_SHA::7}"
          sed -i -E "s/\?v=[A-Za-z0-9]+\"/?v=${V}\"/g" index.html
          grep -c "?v=${V}" index.html
      - name: Add saved forecasts (branch "forecasts", written by forecast-snapshot.yml)
        run: |
          if git fetch -q --depth=1 origin forecasts; then git show origin/forecasts:forecasts.json > data/forecasts.json; else echo "No saved forecasts yet"; fi
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html *.js styles.css data _site/
      - uses: actions/configure-pages@v5
      # A re-run of the same run uploads a second artifact; a name per attempt keeps deploy from finding two
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
